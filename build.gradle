buildscript {
    repositories {
        google()
        jcenter()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven {
            url "https://github.com/jitsi/jitsi-maven-repository/raw/master"
        }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1' // Corrected AGP version
        classpath 'com.google.gms:google-services:4.4.3'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'

    }
}
// Top-level build file where you can add configuration options common to all sub-projects/modules.
// DO NOT USE buildscript {} block here

//plugins {
//    // We define the versions here, and the app module will inherit them
//    id 'com.android.application' version '8.1.4' apply false
//    id 'com.android.library' version '8.1.4' apply false
//    id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
//    id 'com.google.gms.google-services' version '4.4.2' apply false
//}
plugins {
    id 'com.android.application' version '7.4.2' apply false
    id 'com.android.library' version '7.4.2' apply false
    id 'org.jetbrains.kotlin.android' version '1.8.10' apply false
}
task clean(type: Delete) {
    delete rootProject.buildDir
}
