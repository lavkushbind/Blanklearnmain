plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'

    id 'org.jetbrains.kotlin.android'
//    id 'org.jetbrains.kotlin.android' version '1.8.10'
}

android {
    namespace 'com.blank_learn.dark'
    compileSdk 35

    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        pickFirst 'META-INF/DEPENDENCIES'
    }

    defaultConfig {
        applicationId "com.blank_learn.dark"
        minSdk 24
        targetSdk 35
        versionCode  1037
        versionName "10.0.0.37"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildToolsVersion '34.0.0'
}
 dependencies {
    implementation "androidx.multidex:multidex:2.0.1"

      implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.airbnb.android:lottie:6.4.0'
     implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
     implementation 'androidx.activity:activity:1.10.1'
     implementation 'androidx.recyclerview:recyclerview:1.4.0'
     annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.squareup.picasso:picasso:2.8'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.kittinunf.fuel:fuel:2.3.1'
     implementation platform('com.google.firebase:firebase-bom:33.16.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-functions'
    implementation 'com.google.android.gms:play-services-auth'
    implementation 'com.google.android.gms:play-services-base'
     implementation 'com.google.android.gms:play-services-location:21.3.0'
     implementation 'com.google.android.play:integrity:1.4.0'
    implementation 'com.firebaseui:firebase-ui-database:8.0.2'
    implementation 'com.facebook.android:facebook-login:18.0.3'
    implementation 'com.razorpay:checkout:1.6.41'
    implementation 'com.google.android.exoplayer:exoplayer:2.19.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
     implementation 'com.google.android.material:material:1.12.0'
     implementation('org.jitsi.react:jitsi-meet-sdk:10.0.0') { transitive = true }
     // ✅ AI & CameraX
     def camerax_version = "1.3.0" // Use a slightly more recent version
     implementation "androidx.camera:camera-core:${camerax_version}"
     implementation "androidx.camera:camera-camera2:${camerax_version}"
     implementation "androidx.camera:camera-lifecycle:${camerax_version}"
     implementation "androidx.camera:camera-view:${camerax_version}"
     implementation 'com.google.mlkit:face-detection:16.1.6' // Use 16.1.6
     implementation 'com.google.guava:guava:32.1.3-android'

     // ✅ Charting Library (from JitPack)
     implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
//     implementation 'org.webrtc:google-webrtc:1.0.32006'

     implementation 'pub.devrel:easypermissions:3.0.0'

 }
